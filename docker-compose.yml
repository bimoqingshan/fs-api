# FS API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using PostgreSQL instead of MySQL:
#   1. Comment out the mysql service and MySQL SQL_DSN line
#   2. Uncomment the postgres service and PostgreSQL SQL_DSN line
#   3. Switch depends_on from mysql to postgres
#   4. Uncomment pg_data in volumes section
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

services:
  fs-api:
    build:
      context: .
    image: fs-api:local
    container_name: fs-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=root:123456@tcp(mysql:3306)/fs_api?charset=utf8mb4&parseTime=True&loc=Local # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=postgresql://root:123456@postgres:5432/fs_api # Point to the postgres service, uncomment if using PostgreSQL
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=fs-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - SOURCE_CODE_URL=https://github.com/your-org/fs-api  # 修改版源码地址；对外提供 AGPL 服务时建议配置
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - mysql
#      - postgres  # Uncomment if using PostgreSQL
    networks:
      - fs-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: fs-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - fs-api-network

  mysql:
    image: mysql:8.4
    container_name: fs-api-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      MYSQL_DATABASE: fs_api
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fs-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

#  postgres:
#    image: postgres:15
#    container_name: fs-api-postgres
#    restart: always
#    environment:
#      POSTGRES_USER: root
#      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      POSTGRES_DB: fs_api
#    volumes:
#      - pg_data:/var/lib/postgresql/data
#    networks:
#      - fs-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

volumes:
  mysql_data:
#  pg_data:

networks:
  fs-api-network:
    driver: bridge
